<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sohbetix — WhatsApp Sohbet Analizörü</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0a0a0b; --card:#131315; --card-alt:#1a1a1d; --border:#2a2a2d;
    --text:#f2f2f2; --muted:#8a8a8f; --muted2:#a3a3a8; --accent:#e8e8e8;
    --paper:#e6e6e4; --ink:#1a1a1a; --ink-muted:#6a6a6a; --ink-dash:#b5b5b3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); font-family:'Inter',sans-serif; color:var(--text);
    padding:16px;
  }
  .wrap{max-width:960px; margin:0 auto;}
  .header{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .header .icon{background:#e8e8e822; border-radius:12px; padding:8px; display:flex;}
  .header h1{font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0; font-weight:700;}
  .header p{color:var(--muted); font-size:13px; margin:2px 0 0;}

  .dropzone{
    border:2px dashed #4a3a6a; background:linear-gradient(165deg,#1a1230,#100c1f 55%,#0a0a0b);
    border-radius:24px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:56px 24px; gap:16px; transition:border-color .2s; cursor:pointer;
    position:relative; overflow:hidden;
  }
  .dropzone::before{
    content:""; position:absolute; top:-60%; left:50%; transform:translateX(-50%);
    width:220px; height:220px; background:radial-gradient(circle,#8e2de255,transparent 70%);
    pointer-events:none;
  }
  .dropzone::after{
    content:""; position:absolute; bottom:-70%; right:-10%;
    width:240px; height:240px; background:radial-gradient(circle,#e0459c33,transparent 70%);
    pointer-events:none;
  }
  .dropzone.drag{border-color:#e0459c;}
  .dropzone .circle{background:linear-gradient(135deg,#8e2de2,#e0459c); border-radius:999px; padding:16px; box-shadow:0 8px 24px -8px #8e2de288; position:relative; z-index:1;}
  .dropzone .title{font-weight:600; margin-bottom:4px; position:relative; z-index:1;}
  .dropzone .sub{color:var(--muted2); font-size:13px; position:relative; z-index:1;}
  .btn-select{
    background:linear-gradient(120deg,#8e2de2,#e0459c); color:#fff; border:none; border-radius:999px;
    padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
    position:relative; z-index:1; box-shadow:0 8px 20px -10px #8e2de299;
  }
  .hint{font-size:11px; color:#5a5a5e; margin-top:8px;}
  .error-text{color:#c4c4c8; font-size:13px;}
  input[type=file]{display:none;}

  .top-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:13px; color:var(--muted);}
  .btn-reset{
    display:flex; align-items:center; gap:6px; background:var(--card-alt); color:var(--muted2);
    border:none; border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }

  .receipt{
    background:var(--paper); border-radius:16px; padding:26px 24px 22px; max-width:420px; width:100%; margin:0 auto 24px;
    font-family:'JetBrains Mono',monospace; color:var(--ink); overflow-wrap:break-word; box-sizing:border-box;
    position:relative; box-shadow:0 20px 40px -20px rgba(142,45,226,.35);
  }
  .receipt::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px; border-radius:16px 16px 0 0;
    background:linear-gradient(90deg,#8e2de2,#e0459c,#f2994a,#38ef7d,#2193b0,#8e2de2);
    background-size:220% 100%;
  }
  .receipt-head{text-align:center; padding-bottom:10px; padding-top:6px; border-bottom:1px dashed var(--ink-dash); margin-bottom:6px;}
  .receipt-head .t{font-weight:700; letter-spacing:1px; background:linear-gradient(90deg,#8e2de2,#e0459c); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .receipt-head .d{font-size:11px; color:var(--ink-muted);}
  .rline{display:flex; align-items:baseline; gap:8px; font-size:13px; padding:4px 0; flex-wrap:wrap;}
  .rline .l{color:var(--ink-muted); white-space:nowrap; flex-shrink:0;}
  .rline .dots{flex:1; min-width:8px; border-bottom:1px dotted var(--ink-dash); margin-bottom:3px;}
  .rline .v{font-weight:700; text-align:right; margin-left:auto; white-space:normal; word-break:break-word; max-width:100%; color:#7a2fb0;}
  .receipt-foot{text-align:center; margin-top:10px; font-size:11px; color:#9a9a97;}

  .cards-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:24px;}
  .stat-card{background:var(--card-alt); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 18px -14px rgba(0,0,0,.6);}
  .stat-card .row{display:flex; align-items:center; gap:8px;}
  .stat-card .ic{border-radius:8px; padding:6px; display:flex;}
  .stat-card .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .stat-card .val{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700;}
  .stat-card .sub{font-size:12px; color:#6c6c72;}

  .panel{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px; box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 20px -14px rgba(0,0,0,.6);}
  .panel h3{font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0 0 14px; text-transform:uppercase; letter-spacing:.6px; color:#d8d8dc; display:flex; align-items:center;}

  .barlist{display:flex; flex-direction:column; gap:10px;}
  .barlist .row{display:flex; align-items:center; gap:10px;}
  .barlist .name{width:100px; flex-shrink:0; font-size:12px; color:#d4d4d8; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .barlist .track{flex:1; background:var(--card-alt); border-radius:6px; height:20px; overflow:hidden;}
  .barlist .fill{height:100%; border-radius:6px;}
  .barlist .count{width:44px; font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace;}

  .hourly{display:flex; align-items:flex-end; gap:3px; height:140px;}
  .hourly .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .hourly .bar{width:100%; background:#9a9a9f; border-radius:3px 3px 0 0; min-height:2px;}
  .hourly .lbl{font-size:8px; color:#5a5a5e; margin-top:4px;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border-radius:999px; padding:6px 12px; font-weight:600;}
  .chip .n{opacity:.6; font-weight:400;}

  .persons{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px;}
  .person-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; box-shadow:0 8px 18px -14px rgba(0,0,0,.6);}
  .person-card .head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .person-card .head h4{margin:0; font-size:15px; font-weight:700;}
  .person-card .head .pct{color:var(--muted); font-size:12px;}
  .p-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; text-align:center;}
  .p-stats .num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px;}
  .p-stats .lbl{font-size:10px; color:var(--muted);}
  .p-words{display:flex; flex-wrap:wrap; gap:6px;}
  .p-words span{background:var(--card-alt); color:#d4d4d8; border-radius:999px; padding:3px 9px; font-size:11px;}
  .p-sub{
    font-family:'Space Grotesk',sans-serif; font-size:10px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--muted); margin:16px 0 10px; padding-top:12px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:4px;
  }
  .lb-list{display:flex; flex-direction:column; gap:9px;}
  .lb-item{display:flex; align-items:center; gap:10px;}
  .lb-rank{
    width:20px; height:20px; flex-shrink:0; border-radius:6px; background:#2a2a2d; color:#8a8a8f;
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .lb-rank.rank-1{background:#c9a24b2e; color:#d8b567;}
  .lb-rank.rank-2{background:#c4c4c82e; color:#d4d4d8;}
  .lb-rank.rank-3{background:#8686892e; color:#a3a3a8;}
  .lb-em{font-size:18px; width:26px; flex-shrink:0; text-align:center;}
  .lb-bar-wrap{flex:1; background:#0a0a0b; border-radius:5px; height:8px; overflow:hidden;}
  .lb-bar{height:100%; border-radius:5px; background:linear-gradient(90deg,#5a5a5e,#c4c4c8);}
  .lb-item:has(.rank-1) .lb-bar{background:linear-gradient(90deg,#9a7a2e,#d8b567);}
  .lb-count{width:26px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); flex-shrink:0;}

  svg{display:block;}

  .search-row{display:flex; gap:8px; align-items:center;}
  .search-input{
    flex:1; background:var(--card-alt); border:1px solid var(--border); border-radius:999px;
    padding:9px 14px; font-size:13px; color:var(--text); font-family:inherit; outline:none;
  }
  .search-row .btn-select{display:flex; align-items:center; gap:6px; padding:9px 16px;}
  .search-result{margin-top:14px; font-size:13px; color:var(--muted2);}
  .search-result .big{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:var(--text); margin-bottom:6px;}
  .search-result .breakdown{display:flex; flex-direction:column; gap:4px; margin-top:8px;}
  .search-result .breakdown .row{display:flex; justify-content:space-between; font-size:12px;}

  .wrapped-btn-row{display:flex; justify-content:center; margin-top:8px; margin-bottom:20px;}
  @keyframes wrappedGlow{
    0%,100%{box-shadow:0 10px 30px -10px rgba(142,45,226,.65), 0 0 0 0 rgba(224,69,156,.5);}
    50%{box-shadow:0 10px 34px -8px rgba(224,69,156,.8), 0 0 0 8px rgba(224,69,156,0);}
  }
  @keyframes wrappedShine{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .wrapped-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%; max-width:420px;
    background:linear-gradient(120deg,#8e2de2,#e0459c,#f2994a,#8e2de2); background-size:300% 100%;
    color:#fff; border:none; border-radius:18px; padding:18px 24px; font-size:16px; font-weight:700;
    cursor:pointer; font-family:'Space Grotesk',sans-serif;
    animation:wrappedGlow 2.2s ease-in-out infinite, wrappedShine 6s linear infinite;
  }
  .wrapped-btn .big-emoji{font-size:22px;}
  .wrapped-btn .txt{display:flex; flex-direction:column; align-items:flex-start; line-height:1.25;}
  .wrapped-btn .txt .top{font-size:16px;}
  .wrapped-btn .txt .bottom{font-size:11px; font-weight:500; opacity:.85; letter-spacing:.3px;}

  .wrapped-overlay{
    position:fixed; inset:0; z-index:1000; background:#000; overflow:hidden;
    font-family:'Space Grotesk',sans-serif; user-select:none; -webkit-user-select:none;
  }
  .wrapped-progress{position:absolute; top:14px; left:14px; right:14px; display:flex; gap:5px; z-index:20;}
  .wrapped-progress .seg{flex:1; height:3px; background:#ffffff40; border-radius:2px; overflow:hidden;}
  .wrapped-progress .seg .fill{height:100%; width:0%; background:#fff; transition:width .15s linear;}
  .wrapped-close{
    position:absolute; top:26px; right:14px; z-index:20; background:#00000055; border:none; color:#fff;
    width:30px; height:30px; border-radius:999px; font-size:16px; cursor:pointer; display:flex;
    align-items:center; justify-content:center;
  }
  .wrapped-nav{position:absolute; top:0; bottom:0; width:34%; z-index:15; background:transparent; border:none;}
  .wrapped-nav.left{left:0;} .wrapped-nav.right{right:0;}
  .wrapped-slide{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:60px 30px; color:#fff; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .wrapped-slide.active{opacity:1; pointer-events:auto;}
  .wrapped-kicker{font-size:13px; letter-spacing:2px; text-transform:uppercase; opacity:.75; font-weight:600; margin-bottom:14px;}
  .wrapped-emoji{font-size:56px; margin-bottom:10px;}
  .wrapped-bignum{font-size:min(20vw,88px); font-weight:700; line-height:1; margin:6px 0;}
  .wrapped-title{font-size:26px; font-weight:700; line-height:1.3; margin:6px 0;}
  .wrapped-sub{font-size:16px; opacity:.88; margin-top:16px; font-weight:500; max-width:320px;}
  .wrapped-reaction{
    margin-top:14px; background:rgba(255,255,255,.16); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:8px 18px;
    font-size:14px; font-weight:600; max-width:320px;
  }
  .wrapped-name{font-size:34px; font-weight:700; margin:8px 0;}
  .wrapped-foot{position:absolute; bottom:34px; font-size:12px; opacity:.6; letter-spacing:1px;}

  .confetti-canvas{position:fixed; inset:0; z-index:1100; pointer-events:none;}

  .wrapped-badges{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; max-width:340px;}
  .wrapped-badge{padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px);}
  .wrapped-badge.green{background:rgba(56,239,125,.18); border:1px solid rgba(56,239,125,.5); color:#a4f7c4;}
  .wrapped-badge.red{background:rgba(255,88,88,.18); border:1px solid rgba(255,88,88,.5); color:#ffb3b3;}

  .wrapped-download{
    position:absolute; top:24px; left:14px; z-index:20; background:#00000055; border:none; color:#fff;
    padding:8px 14px; border-radius:999px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px;
    font-family:'Space Grotesk',sans-serif; font-weight:600;
  }
  .wrapped-download:disabled{opacity:.6; cursor:default;}

  .export-slide{
    position:fixed; left:-99999px; top:0; width:1080px; height:1920px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:160px 90px; color:#fff;
    font-family:'Space Grotesk',sans-serif; box-sizing:border-box;
  }
  .export-kicker{font-size:34px; letter-spacing:5px; text-transform:uppercase; opacity:.75; font-weight:600; margin-bottom:36px;}
  .export-emoji{font-size:150px; margin-bottom:26px;}
  .export-name{font-size:92px; font-weight:700; margin:22px 0;}
  .export-bignum{font-size:200px; font-weight:700; line-height:1; margin:16px 0;}
  .export-title{font-size:68px; font-weight:700; line-height:1.3; margin:16px 0;}
  .export-sub{font-size:42px; opacity:.88; margin-top:40px; font-weight:500; max-width:820px;}
  .export-reaction{
    margin-top:36px; background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.3);
    border-radius:999px; padding:22px 46px; font-size:38px; font-weight:600; max-width:820px;
  }
  .export-badges{display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:40px; max-width:900px;}
  .export-badge{padding:20px 34px; border-radius:999px; font-size:34px; font-weight:600;}
  .export-badge.green{background:rgba(56,239,125,.22); border:3px solid rgba(56,239,125,.6); color:#a4f7c4;}
  .export-badge.red{background:rgba(255,88,88,.22); border:3px solid rgba(255,88,88,.6); color:#ffb3b3;}
  .export-footer{position:absolute; bottom:70px; font-size:30px; opacity:.55; letter-spacing:3px;}

  .loading-overlay{
    position:fixed; inset:0; z-index:1200; background:rgba(10,10,11,.94); backdrop-filter:blur(6px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  }
  .loading-ring{
    width:56px; height:56px; border-radius:999px; border:4px solid #2a2a2d;
    border-top-color:#e0459c; border-right-color:#8e2de2; animation:loadingSpin .9s linear infinite;
  }
  @keyframes loadingSpin{ to{ transform:rotate(360deg); } }
  .loading-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#f2f2f2;}
  .loading-bar-wrap{width:220px; height:6px; background:#1a1a1d; border-radius:999px; overflow:hidden;}
  .loading-bar{height:100%; width:0%; background:linear-gradient(90deg,#8e2de2,#e0459c); border-radius:999px; transition:width .2s ease;}
  .loading-sub{font-family:'JetBrains Mono',monospace; font-size:12px; color:#8a8a8f;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
    <div>
      <h1>Sohbetix</h1>
      <p>WhatsApp sohbet analizörü — her şey tarayıcında kalır, hiçbir yere yüklenmez.</p>
    </div>
  </div>

  <div id="dropzone" class="dropzone">
    <div class="circle"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
    <div>
      <div class="title">Sohbet dosyanı buraya sürükle</div>
      <div class="sub">ya da seçmek için tıkla — sadece medyasız (.txt) dışa aktarımlar desteklenir</div>
    </div>
    <button class="btn-select" type="button" onclick="document.getElementById('fileInput').click()">Dosya Seç</button>
    <input type="file" id="fileInput" accept=".txt">
    <div id="errorText" class="error-text" style="display:none;"></div>
    <div class="hint">WhatsApp'ta: Sohbet → İsim/Grup → Dışa Aktar → "Medyasız"</div>
  </div>

  <div id="results" style="display:none;"></div>
</div>

<div id="loadingOverlay" class="loading-overlay" style="display:none;">
  <div class="loading-ring"></div>
  <div class="loading-title" id="loadingTitle">Dosya okunuyor</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loadingBar"></div></div>
  <div class="loading-sub" id="loadingSub">%0</div>
</div>

<script>
const PALETTE = ["#e8e8e8", "#9a9a9f", "#c4c4c8", "#b0b0b5", "#868689", "#d4d4d8", "#6f6f73", "#555558"];

const STOPWORDS = new Set([
  "bir","bu","şu","o","ve","veya","ile","de","da","ki","çok","daha","en","gibi","için","ama","fakat",
  "ancak","çünkü","eğer","ise","mi","mı","mu","mü","ne","nasıl","neden","niye","kim","hangi","hiç","her",
  "bazı","tüm","bütün","yani","işte","tabii","tabi","evet","hayır","yok","var","oldu","olur","olan",
  "oluyor","yapmak","yaptım","yaptı","yapıyor","gel","geldi","gitti","git","şey","şeyi","bana","sana",
  "ona","bize","size","onlara","beni","seni","onu","bizi","sizi","benim","senin","onun","bizim","sizin",
  "onların","bunu","bunun","buna","bundan","şunu","burada","şurada","orada","az","biraz","hep","hepsi",
  "herkes","kimse","artık","hala","henüz","sonra","önce","şimdi","bugün","yarın","dün","ya","hem","diye",
  "diyor","dedi","demek","tamam","olsun","falan","filan","aslında","belki","mutlaka","kesin","galiba",
  "sanırım","bilmem","valla","ben","sen","biz","siz","onlar","bende","sende","onda","değil","değildi",
  "oldum","olmuş","olacak","olduğu","olduğunu","kadar","göre","sadece","zaten","peki","haa","aa","yaa",
  "lan","abi","abla","kanka","medya","dahil","edilmedi","mesaj","silindi","message","deleted","omitted",
  "image","video","audio","sticker","gif","document","missed","voice","call","this","you","the","and",
  "için","üzerinden","https","http","www","com",
]);

const CURSE_WORDS = new Set([
  "amk","aq","sg","mal","salak","gerizekalı","gerizekali","aptal","siktir","sik","aminakoyim",
  "yavşak","yavsak","piç","pic","göt","got","ibne","orospu","oç","o.ç","amına","koyim","siktirgit",
]);

const LOVE_WORDS = new Set([
  "seviyorum","seviyom","özledim","ozledim","canım","canim","aşkım","askim","sevgilim",
  "tatlım","tatlim","kalbim","bebeğim","bebegim","hayatım","hayatim","güzelim","guzelim",
  "biricik","meleğim","melegim","şekerim","sekerim","canımsın","canimsin",

  "özür","ozur","üzgünüm","uzgunum","pardon","affedersin","affet","affedersiniz",
  "kusura","sorry","özürlerimi","ozurlerimi",

const EMOJI_RE = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}]/gu;
const GAP_MS = 2 * 60 * 60 * 1000;
const TR_MONTHS_SHORT = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

function monthLabel(key){
  const [y,m] = key.split("-");
  return `${TR_MONTHS_SHORT[parseInt(m,10)-1]} '${y.slice(2)}`;
}

function formatDuration(ms){
  const totalMin = Math.round(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  const parts = [];
  if (days) parts.push(`${days} gün`);
  if (hours) parts.push(`${hours} sa`);
  if (!days && mins) parts.push(`${mins} dk`);
  return parts.length ? parts.join(" ") : "0 dk";
}

function matchHeader(line){
  let m = line.match(/^\[(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}),\s(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[APap][Mm])?)\]\s(.*)$/);
  if (m) return { date: m[1], time: m[2], rest: m[3] };
  m = line.match(/^(\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}),?\s(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[APap][Mm])?)\s-\s(.*)$/);
  if (m) return { date: m[1], time: m[2], rest: m[3] };
  return null;
}

function toTimestamp(date, time){
  try{
    const parts = date.split(/[.\/]/).map(n => parseInt(n,10));
    let [d, mo, y] = parts;
    if (y < 100) y += 2000;
    const pm = /pm/i.test(time);
    const am = /am/i.test(time);
    const clean = time.replace(/\s?[APap][Mm]/,"");
    const tparts = clean.split(":").map(n => parseInt(n,10));
    let hh = tparts[0] || 0, mm = tparts[1] || 0, ss = tparts[2] || 0;
    if (pm && hh < 12) hh += 12;
    if (am && hh === 12) hh = 0;
    const dt = new Date(y, mo-1, d, hh, mm, ss);
    if (isNaN(dt.getTime())) return null;
    return dt;
  } catch { return null; }
}

function parseChat(text){
  const cleaned = text.replace(/[\u200e\u200f\ufeff]/g,"");
  const lines = cleaned.split(/\r?\n/);
  const messages = [];
  for (const rawLine of lines){
    const header = matchHeader(rawLine);
    if (header){
      const senderMatch = header.rest.match(/^([^:]{1,60}?):\s([\s\S]*)$/);
      const ts = toTimestamp(header.date, header.time);
      if (senderMatch){
        const content = senderMatch[2];
        const isMedia = /<Media omitted>|medya dahil edilmedi|<Medya dahil edilmedi>/i.test(content);
        const isDeleted = /this message was deleted|bu mesaj silindi/i.test(content);
        messages.push({ sender: senderMatch[1].trim(), content, ts, isSystem:false, isMedia, isDeleted });
      } else {
        messages.push({ sender:null, content:header.rest, ts, isSystem:true, isMedia:false, isDeleted:false });
      }
    } else if (messages.length > 0 && rawLine.trim() !== ""){
      messages[messages.length-1].content += "\n" + rawLine;
    }
  }
  return messages;
}

function tokenize(content){
  return content
    .toLocaleLowerCase("tr")
    .replace(/[^\p{L}\p{N}\s]+/gu," ")
    .split(/\s+/)
    .filter(w => w.length > 2 && !STOPWORDS.has(w) && isNaN(w));
}

function tokenizeRaw(content){
  return content
    .toLocaleLowerCase("tr")
    .replace(/[^\p{L}\p{N}\s]+/gu," ")
    .split(/\s+/)
    .filter(Boolean);
}

function analyze(messages){
  const real = messages.filter(m => !m.isSystem);
  const senders = [...new Set(real.map(m => m.sender))];
  const perSender = {};
  senders.forEach(s => {
    perSender[s] = { name:s, count:0, words:0, emoji:0, media:0, questions:0, curseCount:0, loveCount:0, apologyCount:0,
      longest:{words:0,preview:""}, wordFreq:{}, emojiFreq:{}, maxStreak:0, starters:0, responseTimes:[], hourly:new Array(24).fill(0) };
  });

  let overallWordFreq = {};
  let overallEmojiFreq = {};
  let hourly = new Array(24).fill(0);
  let monthly = {};
  let daily = {};
  let totalEmoji = 0, totalMedia = 0, totalCurse = 0, totalLove = 0, totalApology = 0;
  let prevSender = null, curStreak = 0, prevTs = null;
  let longestSilence = { ms:0, startTs:null, endTs:null, waitingSender:null, silentSender:null };

  for (const m of real){
    const p = perSender[m.sender];
    p.count += 1;

    if (m.ts){
      hourly[m.ts.getHours()] += 1;
      p.hourly[m.ts.getHours()] += 1;
      const y = m.ts.getFullYear(), mo = m.ts.getMonth();
      const monthKey = `${y}-${String(mo+1).padStart(2,"0")}`;
      monthly[monthKey] = (monthly[monthKey]||0) + 1;
      const dayKey = `${y}-${String(mo+1).padStart(2,"0")}-${String(m.ts.getDate()).padStart(2,"0")}`;
      daily[dayKey] = (daily[dayKey]||0) + 1;

      if (prevTs !== null){
        const diff = m.ts - prevTs;
        if (diff > longestSilence.ms){
          longestSilence = { ms: diff, startTs: prevTs, endTs: m.ts, waitingSender: prevSender, silentSender: m.sender };
        }
        if (m.sender !== prevSender && diff >= 0 && diff <= GAP_MS){
          perSender[m.sender].responseTimes.push(diff/60000);
        }
      }
      if (prevTs === null || (m.ts - prevTs) > GAP_MS) p.starters += 1;
      prevTs = m.ts;
    }

    if (m.sender === prevSender) curStreak += 1; else curStreak = 1;
    prevSender = m.sender;
    if (curStreak > p.maxStreak) p.maxStreak = curStreak;

    if (m.isMedia){ p.media += 1; totalMedia += 1; continue; }
    if (m.isDeleted) continue;

    const emojiMatches = m.content.match(EMOJI_RE);
    if (emojiMatches){
      p.emoji += emojiMatches.length; totalEmoji += emojiMatches.length;
      emojiMatches.forEach(em => {
        overallEmojiFreq[em] = (overallEmojiFreq[em]||0) + 1;
        p.emojiFreq[em] = (p.emojiFreq[em]||0) + 1;
      });
    }

    const qCount = (m.content.match(/\?/g) || []).length;
    if (qCount > 0) p.questions += qCount;

    const rawTokens = tokenizeRaw(m.content);
    rawTokens.forEach(t => {
      if (CURSE_WORDS.has(t)){ p.curseCount += 1; totalCurse += 1; }
      if (LOVE_WORDS.has(t)){ p.loveCount += 1; totalLove += 1; }
      if (APOLOGY_WORDS.has(t)){ p.apologyCount += 1; totalApology += 1; }
    });

    const tokens = tokenize(m.content);
    p.words += tokens.length;
    if (tokens.length > p.longest.words) p.longest = { words: tokens.length, preview: m.content.slice(0,80) };
    tokens.forEach(t => {
      p.wordFreq[t] = (p.wordFreq[t]||0) + 1;
      overallWordFreq[t] = (overallWordFreq[t]||0) + 1;
    });
  }

  const topWordsOverall = Object.entries(overallWordFreq).sort((a,b)=>b[1]-a[1]).slice(0,16);
  const topEmojiOverall = Object.entries(overallEmojiFreq).sort((a,b)=>b[1]-a[1]).slice(0,8);
  senders.forEach(s => {
    perSender[s].topWords = Object.entries(perSender[s].wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,10);
    perSender[s].topEmoji = Object.entries(perSender[s].emojiFreq).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const rt = perSender[s].responseTimes;
    perSender[s].avgResponseMin = rt.length ? rt.reduce((a,b)=>a+b,0)/rt.length : null;
    perSender[s].responseSamples = rt.length;
    const noct = perSender[s].hourly;
    perSender[s].nightCount = noct[0]+noct[1]+noct[2]+noct[3]+noct[4];
    perSender[s].morningCount = noct[5]+noct[6]+noct[7]+noct[8];
  });

  const totalMessages = real.length;
  const byCount = [...senders].sort((a,b)=>perSender[b].count-perSender[a].count);
  const byStreak = [...senders].sort((a,b)=>perSender[b].maxStreak-perSender[a].maxStreak);
  const byStarters = [...senders].sort((a,b)=>perSender[b].starters-perSender[a].starters);
  const byQuestions = [...senders].sort((a,b)=>perSender[b].questions-perSender[a].questions);
  const byLongest = [...senders].sort((a,b)=>perSender[b].longest.words-perSender[a].longest.words);
  const byFastest = senders.filter(s=>perSender[s].responseSamples>=3)
    .sort((a,b)=>perSender[a].avgResponseMin-perSender[b].avgResponseMin);
  const byCurse = [...senders].sort((a,b)=>perSender[b].curseCount-perSender[a].curseCount);
  const byLove = [...senders].sort((a,b)=>perSender[b].loveCount-perSender[a].loveCount);
  const byApology = [...senders].sort((a,b)=>perSender[b].apologyCount-perSender[a].apologyCount);

  const validTs = real.map(m=>m.ts).filter(Boolean).sort((a,b)=>a-b);
  const dateRange = validTs.length ? `${validTs[0].toLocaleDateString("tr-TR")} – ${validTs[validTs.length-1].toLocaleDateString("tr-TR")}` : "bilinmiyor";
  const peakHour = hourly.indexOf(Math.max(...hourly));

  const monthEntries = Object.entries(monthly).sort((a,b)=> a[0] < b[0] ? -1 : 1);
  const peakMonthEntry = monthEntries.length ? [...monthEntries].sort((a,b)=>b[1]-a[1])[0] : null;
  const peakDayEntry = Object.entries(daily).sort((a,b)=>b[1]-a[1])[0] || null;

  // Longest unbroken daily streak (consecutive calendar days with at least one message)
  const dayKeys = Object.keys(daily).sort();
  const parseDayKey = k => { const [y,mo,d] = k.split("-").map(Number); return new Date(y,mo-1,d); };
  let longestDayStreak = { days:0, start:null, end:null };
  if (dayKeys.length){
    let curRun = 1, curStart = dayKeys[0];
    let bestRun = 1, bestStart = dayKeys[0], bestEnd = dayKeys[0];
    for (let i=1;i<dayKeys.length;i++){
      const diffDays = Math.round((parseDayKey(dayKeys[i]) - parseDayKey(dayKeys[i-1])) / 86400000);
      if (diffDays === 1){ curRun += 1; } else { curRun = 1; curStart = dayKeys[i]; }
      if (curRun > bestRun){ bestRun = curRun; bestStart = curStart; bestEnd = dayKeys[i]; }
    }
    longestDayStreak = { days: bestRun, start: parseDayKey(bestStart), end: parseDayKey(bestEnd) };
  }

  return { senders, perSender, totalMessages, byCount, byStreak, byStarters, byQuestions, byLongest, byFastest, byCurse, byLove, byApology,
    topWordsOverall, topEmojiOverall, hourly, monthEntries, peakMonthEntry, peakDayEntry, longestDayStreak,
    totalEmoji, totalMedia, totalCurse, totalLove, totalApology, dateRange, peakHour, longestSilence, messages: real };
}

function esc(s){
  const d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

function rline(label, value){
  return `<div class="rline"><span class="l">${esc(label)}</span><span class="dots"></span><span class="v">${esc(value)}</span></div>`;
}

function statCard(iconSvg, label, value, sub, color){
  return `<div class="stat-card">
    <div class="row"><div class="ic" style="background:${color}22">${iconSvg}</div><span class="lbl">${esc(label)}</span></div>
    <div class="val">${esc(value)}</div>
    <div class="sub">${esc(sub)}</div>
  </div>`;
}

function hashStr(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return h;
}

const CHARACTER_FALLBACK_TITLES = ["Forrest Gump","Amelie Poulain","Paddington Ayı","Ferris Bueller","WALL-E","Shrek","Winnie the Pooh","Sherlock Holmes'un Dr. Watson'ı","Luke Skywalker"];

function computeCharacters(stats){
  const results = {};
  const winners = {};

  Object.entries(CHARACTER_POOL).forEach(([key, def]) => {
    const dir = def.sortDir || "desc";
    const vals = stats.senders
      .map(s => [s, def.metric(s, stats)])
      .filter(([,v]) => v !== null && v !== undefined && !Number.isNaN(v));
    if (!vals.length) return;
    vals.sort((a,b) => dir === "asc" ? a[1]-b[1] : b[1]-a[1]);
    const [topSender, topVal] = vals[0];
    if (!def.qualify(topVal)) return;
    const secondVal = vals.length > 1 ? vals[1][1] : null;
    let dominance;
    if (secondVal === null){
      dominance = 999;
    } else if (dir === "asc"){
      dominance = (secondVal - topVal) + 1;
    } else {
      dominance = topVal - secondVal + 1;
    }
    winners[key] = { sender: topSender, value: topVal, dominance };
  });

  const bySender = {};
  Object.entries(winners).forEach(([key, w]) => {
    if (!bySender[w.sender] || w.dominance > bySender[w.sender].dominance){
      bySender[w.sender] = { category: key, ...w };
    }
  });

  stats.senders.forEach(s => {
    const win = bySender[s];
    if (win){
      const def = CHARACTER_POOL[win.category];
      const tier = def.tiers.find(t => win.value <= t.max) || def.tiers[def.tiers.length-1];
      const idx = Math.abs(hashStr(s+win.category)) % tier.titles.length;
      results[s] = { title: tier.titles[idx], emoji: def.emoji, sub: def.subLabel(win.value) };
    } else {
      const idx = Math.abs(hashStr(s+"fallback")) % CHARACTER_FALLBACK_TITLES.length;
      results[s] = { title: CHARACTER_FALLBACK_TITLES[idx], emoji: "🎭", sub: "Kendine has bir sohbet tarzı var" };
    }
  });

  return results;
}

function renderCharacters(stats){
  const chars = computeCharacters(stats);
  let html = `<div class="panel"><h3>🎭 Karakterleriniz</h3><div class="persons">`;
  stats.byCount.forEach(s => {
    const c = chars[s];
    html += `<div class="person-card">
      <div class="head"><h4>${esc(s)}</h4></div>
      <div style="text-align:center;padding:4px 0 2px;">
        <div style="font-size:36px;line-height:1;">${c.emoji}</div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-top:8px;">${esc(c.title)}</div>
        <div style="color:var(--muted);font-size:12px;margin-top:4px;">${esc(c.sub)}</div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function searchWord(){
  const input = document.getElementById("wordSearchInput");
  const resultEl = document.getElementById("wordSearchResult");
  const raw = input.value.trim();
  if (!raw || !currentStats){
    resultEl.innerHTML = "";
    return;
  }
  const needle = raw.toLocaleLowerCase("tr");
  let total = 0;
  const perSenderCount = {};
  currentStats.senders.forEach(s => perSenderCount[s] = 0);

  currentStats.messages.forEach(m => {
    const hay = (m.content || "").toLocaleLowerCase("tr");
    if (!hay.includes(needle)) return;
    let idx = 0, n = 0;
    while (true){
      idx = hay.indexOf(needle, idx);
      if (idx === -1) break;
      n += 1;
      idx += needle.length;
    }
    total += n;
    perSenderCount[m.sender] = (perSenderCount[m.sender]||0) + n;
  });

  let html = `<div class="big">"${esc(raw)}" — ${total} kez geçti</div>`;
  if (total > 0 && currentStats.senders.length > 1){
    html += `<div class="breakdown">`;
    [...currentStats.senders].sort((a,b)=>perSenderCount[b]-perSenderCount[a]).forEach(s => {
      html += `<div class="row"><span>${esc(s)}</span><span>${perSenderCount[s]}</span></div>`;
    });
    html += `</div>`;
  }
  resultEl.innerHTML = html;
}

function setLoadingProgress(pct, title){
  document.getElementById("loadingBar").style.width = Math.max(0, Math.min(100, pct)) + "%";
  document.getElementById("loadingSub").textContent = `%${Math.round(pct)}`;
  if (title) document.getElementById("loadingTitle").textContent = title;
}
function hideLoading(){
  document.getElementById("loadingOverlay").style.display = "none";
}

function handleFile(file){
  if (!file) return;
  if (!file.name.toLowerCase().endsWith(".txt")){
    showError("Lütfen WhatsApp'tan dışa aktarılan bir .txt dosyası yükle.");
    return;
  }
  document.getElementById("errorText").style.display = "none";
  showLoading("Dosya okunuyor");

  const reader = new FileReader();
  reader.onprogress = e => {
    if (e.lengthComputable){
      setLoadingProgress((e.loaded / e.total) * 60, "Dosya okunuyor");
    }
  };
  reader.onload = e => {
    const text = e.target.result;
    setLoadingProgress(65, "Mesajlar ayrıştırılıyor");
    setTimeout(() => {
      const messages = parseChat(text);
      setLoadingProgress(85, "İstatistikler hesaplanıyor");
      setTimeout(() => {
        const stats = analyze(messages);
        if (stats.senders.length === 0){
          hideLoading();
          showError("Bu dosyayı okuyamadım — dosya formatı beklediğim WhatsApp dışa aktarım biçiminde olmayabilir.");
          return;
        }
        setLoadingProgress(100, "Hazır!");
        setTimeout(() => {
          hideLoading();
          render(stats, file.name);
          openWrapped();
        }, 200);
      }, 30);
    }, 30);
  };
  reader.onerror = () => { hideLoading(); showError("Dosya okunamadı, tekrar dener misin?"); };
  reader.readAsText(file, "utf-8");
}

  document.getElementById("results").innerHTML = "";
  document.getElementById("dropzone").style.display = "flex";

  document.getElementById("errorText").style.display = "none";
}

function pick(cond, arr){ return arr[Math.min(arr.length-1, Math.floor(cond*arr.length))]; }

function computeCompatibility(stats){
  const p = s => stats.perSender[s];

  // Denge: mesaj dağılımı 50/50'ye ne kadar yakın
  const topPct = (p(stats.byCount[0]).count/stats.totalMessages)*100;
  const balanceScore = Math.max(0, 100 - Math.abs(50-topPct)*2);

  // Hız: ortalama cevap süresi ne kadar kısa
  const responseVals = stats.senders.map(s=>p(s).avgResponseMin).filter(v=>v!=null);
  const avgResp = responseVals.length ? responseVals.reduce((a,b)=>a+b,0)/responseVals.length : null;
  const speedScore = avgResp!=null ? Math.max(0, Math.min(100, 100 - avgResp*3)) : 55;

  // Süreklilik: en uzun kesintisiz seri
  const streakScore = Math.min(100, stats.longestDayStreak.days*4);

  // Sessizlik: en uzun sessizlik ne kadar kısa
  const silenceDays = stats.longestSilence.ms/86400000;
  const silenceScore = Math.max(0, 100 - silenceDays*2);

  // Sevgi/küfür dengesi
  const loveCurseScore = (stats.totalLove+stats.totalCurse) > 0
    ? Math.max(0, Math.min(100, 50 + (stats.totalLove-stats.totalCurse)*1.5))
    : 55;

  const raw = balanceScore*0.3 + speedScore*0.25 + streakScore*0.2 + silenceScore*0.15 + loveCurseScore*0.1;
  return Math.round(Math.max(5, Math.min(99, raw)));
}

function computeFlags(stats){
  const p = s => stats.perSender[s];
  const badges = {};
  stats.senders.forEach(s => { badges[s] = { green: [], red: [] }; });

  // Green flag candidates
  if (stats.byFastest.length){
    const s = stats.byFastest[0];
    if (p(s).avgResponseMin < 20) badges[s].green.push({ emoji:"⚡", label:"Hızlı Dönüş Yapıyor" });
  }
  if (stats.byStarters[0] && p(stats.byStarters[0]).starters >= 3){
    badges[stats.byStarters[0]].green.push({ emoji:"💬", label:"Sohbeti Hep O Başlatıyor" });
  }
  if (stats.byLove[0] && p(stats.byLove[0]).loveCount >= 3){
    badges[stats.byLove[0]].green.push({ emoji:"💌", label:"Sevgisini Belli Ediyor" });
  }
  stats.senders.forEach(s => {
    const pct = (p(s).count/stats.totalMessages)*100;
    if (pct >= 40 && pct <= 60) badges[s].green.push({ emoji:"⚖️", label:"Dengeli Katılım Gösteriyor" });
  });

  // Red flag candidates
  if (stats.longestSilence.ms > 0 && stats.longestSilence.silentSender){
    const s = stats.longestSilence.silentSender;
    if (stats.longestSilence.ms/86400000 >= 3) badges[s].red.push({ emoji:"👻", label:"Bazen Ortadan Kayboluyor" });
  }
  if (stats.byFastest.length){
    stats.senders.forEach(s => {
      if (p(s).avgResponseMin != null && p(s).avgResponseMin > 30) badges[s].red.push({ emoji:"🐢", label:"Cevap Vermesi Zaman Alıyor" });
    });
  }
  if (stats.byCurse[0] && p(stats.byCurse[0]).curseCount >= 5){
    badges[stats.byCurse[0]].red.push({ emoji:"🤬", label:"Küfüre Doymuyor" });
  }
  stats.senders.forEach(s => {
    const pct = (p(s).count/stats.totalMessages)*100;
    if (pct >= 65) badges[s].red.push({ emoji:"📢", label:"Sohbeti Tek Başına Domine Ediyor" });
  });
  if (stats.byApology && stats.byApology[0] && p(stats.byApology[0]).apologyCount >= 8){
    badges[stats.byApology[0]].red.push({ emoji:"🙏", label:"Sürekli Özür Diliyor" });
  }

  let greenHolder = stats.senders[0], redHolder = stats.senders[0];
  stats.senders.forEach(s => {
    if (badges[s].green.length > badges[greenHolder].green.length) greenHolder = s;
    if (badges[s].red.length > badges[redHolder].red.length) redHolder = s;
  });

  const greenBadges = badges[greenHolder].green.length
    ? badges[greenHolder].green.slice(0,3)
    : [{ emoji:"🙂", label:"Sakin Bir Sohbet Ortağı" }];
  const redBadges = badges[redHolder].red.length
    ? badges[redHolder].red.slice(0,3)
    : [{ emoji:"🤷", label:"Belirgin Bir Kusuru Yok Aslında" }];

  return { greenHolder, greenBadges, redHolder, redBadges };
}

function buildWrappedSlides(stats){
  const slides = [];
  const p = s => stats.perSender[s];
  const [nameA, nameB] = stats.senders;

  // Açılış
  slides.push({ kicker: stats.dateRange, emoji: "🎁", title: "Sohbet Wrapped", sub: `${stats.senders.join(" & ")} arasında geçen ${stats.totalMessages} mesajın hikayesi`, confetti: true });

  // Karakterler — herkese bir kimlik
  const characters = computeCharacters(stats);
  stats.senders.forEach(s => {
    const c = characters[s];
    slides.push({ kicker: "Karakterin 🎭", emoji: c.emoji, name: s, title: c.title, sub: c.sub });
  });

  // Toplam mesaj — hacme göre doğal yorum
  slides.push({
    kicker: "Toplam",
    bignum: stats.totalMessages,
    title: "mesaj gönderildi",
    sub: stats.totalMessages > 5000 ? "Bu gerçekten çok konuşulmuş, tebrikler 👏"
       : stats.totalMessages > 2000 ? "Fena değil, epey sohbet var burada"
       : "Az ama öz, her mesaj değerli"
  });

  // En çok yazan — dengeli mi domine mi
  const topPct = (p(stats.byCount[0]).count/stats.totalMessages)*100;
  const balanceComment = topPct >= 65
    ? `${stats.byCount[0]} sohbeti sırtlamış resmen, ${stats.senders.find(s=>s!==stats.byCount[0])} biraz suskun kalmış 😄`
    : topPct >= 55
    ? `${stats.byCount[0]} biraz daha önde ama aranızda ciddi bir denge var`
    : "Neredeyse baş başa gidiyorsunuz, ikiniz de eşit katkı sağlamışsınız";
  slides.push({ kicker: "En çok yazan", name: stats.byCount[0], sub: `mesajların %${topPct.toFixed(0)}'ini o gönderdi (${p(stats.byCount[0]).count} mesaj)`, reaction: balanceComment });

  // En aktif saat — zaman dilimine göre yorum
  const h = stats.peakHour;
  const hourComment = h >= 0 && h < 6 ? "Gece kuşlarısınız siz, en aktif saat resmen gece yarısı sonrası 🌙"
    : h < 10 ? "Sabahın köründe bile mesajlaşmışsınız, enerjinize diyecek yok ☀️"
    : h < 17 ? "Gün ortası sohbetleri sizin tarzınız gibi görünüyor"
    : h < 21 ? "Akşamüstü molası tam sohbet vaktiymiş 🌆"
    : "Klasik gece sohbetçileri, en yoğun an gece vakti 🌃";
  slides.push({ kicker: "En aktif saat", bignum: `${String(h).padStart(2,"0")}:00`, title: "günün en yoğun anı", sub: hourComment });

  if (stats.peakMonthEntry){
    slides.push({ kicker: "En aktif ay", title: monthLabel(stats.peakMonthEntry[0]), sub: `${stats.peakMonthEntry[1]} mesajla rekor kırıldı — o ay neler oldu acaba 👀` });
  }

  if (stats.topWordsOverall[0]){
    slides.push({ kicker: "En popüler kelime", title: `"${stats.topWordsOverall[0][0]}"`, sub: `${stats.topWordsOverall[0][1]} kez kullanılmış, artık sizin imzanız gibi bir şey oldu bu kelime` });
  }

  if (stats.topEmojiOverall[0]){
    const ec = stats.topEmojiOverall[0][1];
    slides.push({ kicker: "En popüler emoji", emoji: stats.topEmojiOverall[0][0], bignum:"", sub: `${ec} kez kullanılmış — bu emoji artık sohbetinizin resmi maskotu 🏅` });
  }

  if (stats.totalLove > 0){
    const lc = p(stats.byLove[0]).loveCount;
    slides.push({ kicker: "En Çok Sevgi Kelimesi 💌", name: stats.byLove[0], sub: `${lc} kez sevgisini gösterdi`, reaction: lc >= 40 ? "Umarım love bombing değildir 😅" : "Ara sıra da olsa kalbini gösteriyor" });
  }

  if (stats.totalApology > 0){
    const ac = p(stats.byApology[0]).apologyCount;
    const reaction = ac >= 15 ? "Sürekli özür diliyor, ya çok kibar ya da çok pot kırıyor 😅"
      : ac >= 5 ? "Arada bir 'kusura bakma' diyor, gayet nazik 🙂"
      : "Nadiren özür diliyor ama gerektiğinde diliyor";
    slides.push({ kicker: "Özür Şampiyonu 🙏", name: stats.byApology[0], sub: `${ac} kez özür diledi`, reaction });
  }

  if (stats.totalCurse > 0){
    const cc = p(stats.byCurse[0]).curseCount;
    slides.push({ kicker: "Küfür Baronu 😤", name: stats.byCurse[0], sub: `${cc} kez küfür etti`, reaction: cc >= 30 ? "Ağzının tadını hiç bozmamış 😅" : "Arada bir patlıyor ama idare eder" });
  }

  if (stats.longestDayStreak.days > 1){
    const days = stats.longestDayStreak.days;
    const reaction = days >= 21 ? "Neredeyse hiç ara vermemişsiniz, gerçek bir ekip 🔥"
      : days >= 14 ? "Ohh bol bol sohbet edin 😄"
      : days >= 7 ? "Fena kaynaşmışsınız 👏"
      : "Güzel bir seri 🙂";
    slides.push({ kicker: "Kesintisiz Seri", bignum: days, title: "gün art arda mesajlaştınız", sub: "", reaction });
  }

  if (stats.longestSilence.ms > 0){
    const silenceDays = stats.longestSilence.ms / 86400000;
    const ghoster = stats.longestSilence.silentSender;
    const waiter = stats.longestSilence.waitingSender;
    const reaction = ghoster && waiter
      ? (silenceDays >= 30 ? `${ghoster}, ${waiter}'i tam ${formatDuration(stats.longestSilence.ms)} bekletti 👀`
         : silenceDays >= 7 ? `${ghoster} biraz gecikmiş, ${waiter} sabırla beklemiş 🤔`
         : `${ghoster} ufak bir mola vermiş, olur böyle 🙂`)
      : "Kim kimi bekletti, sohbet biraz suskun kalmış";
    slides.push({ kicker: "Kim Kimi Ghostingledi", bignum: formatDuration(stats.longestSilence.ms), title: "en uzun sessizlik", sub: "", reaction });
  }

  if (stats.byFastest.length){
    const rt = p(stats.byFastest[0]).avgResponseMin;
    const reaction = rt < 2 ? "Telefonu elinden hiç bırakmıyor galiba 📱" : rt < 10 ? "Gayet çabuk dönüyor, ihmal yok" : "Acele etmiyor ama sonunda dönüyor";
    slides.push({ kicker: "En Hızlı Cevap", name: stats.byFastest[0], sub: `ortalama ${rt.toFixed(1)} dakikada döner`, reaction });
  }

  const flags = computeFlags(stats);
  const greenReaction = flags.greenBadges.length >= 2 ? "Tam bir yeşil bayrak! 🟢" : flags.greenBadges.length === 1 && flags.greenBadges[0].emoji !== "🙂" ? "Ufak ama gerçek bir yeşil bayrak 🌱" : "Kötü bir şey yok, sakin gidiyor 🙂";
  slides.push({ kicker: "Yeşil Bayrak 🟢", name: flags.greenHolder, sub: greenReaction, badges: flags.greenBadges.map(b => ({ ...b, type:"green" })) });

  const redReaction = flags.redBadges.length >= 2 ? "Dikkat, kırmızı alarm 🚩🚩" : flags.redBadges.length === 1 && flags.redBadges[0].emoji !== "🤷" ? "Küçük bir kırmızı bayrak var 🚩" : "Aslında pek kusuru yok, merak etme 😌";
  slides.push({ kicker: "Kırmızı Bayrak 🚩", name: flags.redHolder, sub: redReaction, badges: flags.redBadges.map(b => ({ ...b, type:"red" })) });

  const score = computeCompatibility(stats);
  const scoreLabel = score >= 90 ? "Efsane ikili 🔥" : score >= 75 ? "Gayet uyumlu bir çift 💫" : score >= 60 ? "Fena değil, güzel gidiyor 🙂" : score >= 40 ? "Ortalama bir uyum, geliştirilebilir" : "Biraz mesafeli görünüyorsunuz, biraz daha çaba lazım 🤏";
  slides.push({ kicker: "Uyum Skoru", bignum: `%${score}`, title: "uyumlusunuz", sub: scoreLabel });

  slides.push({ kicker: "Teşekkürler", emoji: "✨", title: "İşte sohbetinizin özeti!", sub: `${stats.totalMessages} mesaj, ${stats.senders.length} kişi, bir sürü anı — bir sonrakine kadar 👋`, confetti: true });

  return slides;
}

// ---------- Confetti ----------
function fireConfetti(){
  const canvas = document.createElement("canvas");
  canvas.className = "confetti-canvas";
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const colors = ["#8e2de2","#e0459c","#f2994a","#38ef7d","#2193b0","#ffd166","#ffffff"];
  const count = 140;
  const pieces = Array.from({ length: count }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.4,
    w: 6 + Math.random() * 6,
    h: 8 + Math.random() * 10,
    color: colors[Math.floor(Math.random() * colors.length)],
    speedY: 2.5 + Math.random() * 3.5,
    speedX: -1.8 + Math.random() * 3.6,
    rotation: Math.random() * 360,
    rotSpeed: -9 + Math.random() * 18,
  }));

  const onResize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
  window.addEventListener("resize", onResize);

  let frame = 0;
  const maxFrames = 150;
  function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      p.speedY += 0.02;
      p.rotation += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame += 1;
    if (frame < maxFrames){
      requestAnimationFrame(draw);
    } else {
      window.removeEventListener("resize", onResize);
      canvas.remove();
    }
  }
  draw();
}

// ---------- Whoosh ses efekti ----------
let _wrappedAudioCtx = null;
function playWhoosh(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (!_wrappedAudioCtx) _wrappedAudioCtx = new AudioCtx();
    const ctx = _wrappedAudioCtx;
    if (ctx.state === "suspended") ctx.resume();

    const dur = 0.25;
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 0.7;
    filter.frequency.setValueAtTime(1400, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + dur);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start();
    noise.stop(ctx.currentTime + dur + 0.02);
  } catch(e){ /* sesli ortam desteklenmiyor, sessizce geç */ }
}

let wrappedSlides = [];
let wrappedIndex = 0;

function openWrapped(){
  if (!currentStats) return;
  wrappedSlides = buildWrappedSlides(currentStats);
  wrappedIndex = 0;

  const overlay = document.createElement("div");
  overlay.className = "wrapped-overlay";
  overlay.id = "wrappedOverlay";

  let progressHtml = `<div class="wrapped-progress">`;
  wrappedSlides.forEach(() => { progressHtml += `<div class="seg"><div class="fill"></div></div>`; });
  progressHtml += `</div>`;

  let slidesHtml = "";
  wrappedSlides.forEach((s,i) => {
    const bg = WRAPPED_GRADIENTS[i % WRAPPED_GRADIENTS.length];
    slidesHtml += `<div class="wrapped-slide" data-i="${i}" style="background:${bg}">
      ${s.kicker ? `<div class="wrapped-kicker">${esc(s.kicker)}</div>` : ""}
      ${s.emoji ? `<div class="wrapped-emoji">${s.emoji}</div>` : ""}
      ${s.name ? `<div class="wrapped-name">${esc(s.name)}</div>` : ""}
      ${(s.bignum !== undefined && s.bignum !== "") ? `<div class="wrapped-bignum">${esc(s.bignum)}</div>` : ""}
      ${s.title ? `<div class="wrapped-title">${esc(s.title)}</div>` : ""}
      ${s.sub ? `<div class="wrapped-sub">${esc(s.sub)}</div>` : ""}
      ${s.reaction ? `<div class="wrapped-reaction">${esc(s.reaction)}</div>` : ""}
      ${s.badges ? `<div class="wrapped-badges">${s.badges.map(b => `<div class="wrapped-badge ${b.type}">${b.emoji ? b.emoji+" " : ""}${esc(b.label)}</div>`).join("")}</div>` : ""}
    </div>`;
  });

  overlay.innerHTML = `
    ${progressHtml}
    <button class="wrapped-close" onclick="closeWrapped()">✕</button>
    <button class="wrapped-download" id="wrappedDownloadBtn" onclick="downloadWrappedSlide()">⬇ PNG indir</button>
    <button class="wrapped-nav left" onclick="wrappedStep(-1)" aria-label="Önceki"></button>
    <button class="wrapped-nav right" onclick="wrappedStep(1)" aria-label="Sonraki"></button>
    ${slidesHtml}
    <div class="wrapped-foot">dokunarak ilerle</div>
  `;

  document.body.appendChild(overlay);
  document.body.style.overflow = "hidden";
  showWrappedSlide(0);
}

function showWrappedSlide(i){
  const overlay = document.getElementById("wrappedOverlay");
  if (!overlay) return;
  wrappedIndex = Math.max(0, Math.min(i, wrappedSlides.length-1));
  overlay.querySelectorAll(".wrapped-slide").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.i) === wrappedIndex);
  });
  overlay.querySelectorAll(".wrapped-progress .seg").forEach((seg,idx) => {
    seg.querySelector(".fill").style.width = idx < wrappedIndex ? "100%" : idx === wrappedIndex ? "100%" : "0%";
  });
  if (wrappedSlides[wrappedIndex] && wrappedSlides[wrappedIndex].confetti){
    fireConfetti();
  }
}

function wrappedStep(dir){
  const next = wrappedIndex + dir;
  if (next < 0) return;
  if (next >= wrappedSlides.length){ closeWrapped(); return; }
  showWrappedSlide(next);
}

function closeWrapped(){
  const overlay = document.getElementById("wrappedOverlay");
  if (overlay) overlay.remove();
  document.body.style.overflow = "";
}

async function downloadWrappedSlide(){
  if (!wrappedSlides.length) return;
  const slide = wrappedSlides[wrappedIndex];
  const btn = document.getElementById("wrappedDownloadBtn");

  if (typeof html2canvas === "undefined"){
    alert("Görsel oluşturma kütüphanesi yüklenemedi — internet bağlantını kontrol edip tekrar dener misin?");
    return;
  }

  const originalLabel = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = "Hazırlanıyor..."; }

  const bg = WRAPPED_GRADIENTS[wrappedIndex % WRAPPED_GRADIENTS.length];
  const container = document.createElement("div");
  container.className = "export-slide";
  container.style.background = bg;
  container.innerHTML = `
    ${slide.kicker ? `<div class="export-kicker">${esc(slide.kicker)}</div>` : ""}
    ${slide.emoji ? `<div class="export-emoji">${slide.emoji}</div>` : ""}
    ${slide.name ? `<div class="export-name">${esc(slide.name)}</div>` : ""}
    ${(slide.bignum !== undefined && slide.bignum !== "") ? `<div class="export-bignum">${esc(slide.bignum)}</div>` : ""}
    ${slide.title ? `<div class="export-title">${esc(slide.title)}</div>` : ""}
    ${slide.sub ? `<div class="export-sub">${esc(slide.sub)}</div>` : ""}
    ${slide.reaction ? `<div class="export-reaction">${esc(slide.reaction)}</div>` : ""}
    ${slide.badges ? `<div class="export-badges">${slide.badges.map(b => `<div class="export-badge ${b.type}">${b.emoji ? b.emoji+" " : ""}${esc(b.label)}</div>`).join("")}</div>` : ""}
    <div class="export-footer">🧾 Sohbetix</div>
  `;
  document.body.appendChild(container);

  try{
    const canvas = await html2canvas(container, { width: 1080, height: 1920, backgroundColor: null, scale: 1 });
    const safeName = (slide.kicker || "sohbet-wrapped")
      .toLowerCase()
      .replace(/[^a-z0-9ığüşöç\s-]/gi, "")
      .trim()
      .replace(/\s+/g, "-");
    const link = document.createElement("a");
    link.download = `sohbet-wrapped-${safeName || wrappedIndex + 1}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } catch(err){
    alert("Görsel oluşturulamadı, tekrar dener misin?");
  } finally {
    container.remove();
    if (btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
}

const dz = document.getElementById("dropzone");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("drag"); handleFile(e.dataTransfer.files[0]); });
document.getElementById("fileInput").addEventListener("change", e => handleFile(e.target.files[0]));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
